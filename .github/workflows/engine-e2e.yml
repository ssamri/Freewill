name: embedded engine end to end

# Real models, real runtime, real training: what cannot be checked with the toy models of the test suite.
# Linux: a being converses with Qwen3 1.7B, sleeps, and its engine learns (LoRA on CPU), is measured,
# converted and loaded by llama.cpp. Windows: SmolVLM2 2.2B and Qwen3 1.7B are fetched and spoken to
# as the application does, and the adapter learned on Linux is loaded by llama.cpp on Windows.

on:
  pull_request:
    paths:
      - "freewill/engines/**"
      - "freewill/learning/**"
      - "freewill/models.json"
      - "freewill/models.py"
      - "freewill/runtime.py"
      - "freewill/runtime.json"
      - "freewill/core/loop.py"
      - "tools/engine_e2e.py"
      - "tools/embedded_check.py"
      - ".github/workflows/engine-e2e.yml"
  workflow_dispatch:
    inputs:
      nights:
        description: "Nights of engine learning"
        default: "2"
      steps:
        description: "Training steps per night"
        default: "40"

permissions:
  contents: read

jobs:
  linux-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (PyTorch for CPU, PEFT, Transformers, gguf)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[lora,dev]"
          python -c "import torch, transformers, peft, gguf; print('torch', torch.__version__, 'transformers', transformers.__version__, 'peft', peft.__version__)"
      - name: Machine
        run: nproc; free -g; df -h .
      - uses: actions/cache@v4
        with:
          path: e2e-data/models
          key: models-qwen3-1.7b-${{ hashFiles('freewill/models.json') }}
      - name: A being converses, sleeps, and its engine learns
        run: |
          python tools/engine_e2e.py e2e-out --data e2e-data --nights "${{ inputs.nights || '2' }}" --steps "${{ inputs.steps || '40' }}"
      - name: Results
        if: always()
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("e2e-out/e2e.json"))
          for s in d["steps"]:
              print(f"{s['status']:7} {s['seconds']:8.1f}s  {s['step']}")
              if s["status"] != "ok":
                  print("   ", s.get("error"))
              elif s["step"] in ("a person vouches for twelve facts and how to test them", "what the night trains on", "the conversing model holds the adapter",
                                 "Research Lab comparison: base, adapted, controls", "restore the base, then the checkpoint",
                                 "the conversing model holds the latest adapter"):
                  print(json.dumps(s.get("result"), indent=1, ensure_ascii=False)[:6000])
          for row in d.get("ledger", []):
              keep = {k: row.get(k) for k in ("kind", "decision", "version", "reason", "seconds", "growth", "runtime_check",
                                              "rules", "control", "capabilities", "sealed_test_read", "sets_read")}
              cands = row.get("candidates") or {}
              keep["candidates"] = {n: {"scores": c["scores"], "verdict": c["verdict"], "rank": c["rank"], "parameters": c["parameters"],
                                        "training": c.get("training")} for n, c in cands.items()}
              keep["items"] = {k: row.get(k) for k in ("train_items_new", "train_items_replayed", "train_items_rehearsal", "held_out_new", "held_out_earlier",
                                                     "held_out_leaked", "train_by_provenance")}
              keep["scores_base"] = row.get("scores_base")
              print(json.dumps(keep, indent=1))
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-e2e-linux
          path: |
            e2e-out/e2e.json
            e2e-out/adapters/
            e2e-out/lives/Ada.life/engine/ledger.jsonl
            e2e-out/lives/Ada.life/engine/train.jsonl
            e2e-out/lives/Ada.life/engine/validation.jsonl
            e2e-out/lives/Ada.life/engine/test.jsonl
            e2e-out/lives/Ada.life/engine/facts.jsonl
            e2e-out/lives/Ada.life/engine/probes.jsonl
            e2e-out/lives/Ada.life/engine/test_access.jsonl
            e2e-out/lives/Ada.life/events.log
          if-no-files-found: warn

  windows-models:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" gguf
      - uses: actions/cache@v4
        with:
          path: win-out/data/models
          key: models-win-${{ hashFiles('freewill/models.json') }}
      - name: SmolVLM2 2.2B and Qwen3 1.7B on Windows, as the application runs them
        run: python tools/embedded_check.py win-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-check-windows
          path: win-out/check.json

  windows-adapter:
    needs: linux-learning
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" gguf
      - uses: actions/download-artifact@v4
        with:
          name: engine-e2e-linux
          path: linux
      - uses: actions/cache@v4
        with:
          path: win-adapter/data/models
          key: models-win-qwen3-${{ hashFiles('freewill/models.json') }}
      - name: The adapter learned on Linux, loaded by llama.cpp on Windows
        shell: pwsh
        run: |
          $adapter = Get-ChildItem -Path linux/adapters -Directory -ErrorAction SilentlyContinue | Sort-Object Name | Select-Object -Last 1
          if (-not $adapter) {
            Write-Output "No adapter was kept on Linux (every night was rejected by its rules): nothing to load here."
            exit 0
          }
          python tools/embedded_check.py win-adapter --models qwen3-1.7b --adapter $adapter.FullName --adapter-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adapter-check-windows
          path: win-adapter/check.json
