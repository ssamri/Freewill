name: model catalogue

on:
  pull_request:
    paths:
      - "freewill/models.json"
      - "tools/catalogue.py"
      - ".github/workflows/catalogue.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The embedded runtime available upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/ggml-org/llama.cpp/releases?per_page=6" --jq '.[] | "== \(.tag_name) prerelease=\(.prerelease) \(.published_at)", (.assets[] | "   \(.name) \(.size)")' | grep -v -i "cuda\|vulkan\|sycl\|hip\|opencl\|xcframework\|android\|s390\|kleidi\|openvino" | head -80
          gh release download --repo ggml-org/llama.cpp --pattern nightly-tag.txt --output - || true
      - name: Check every model against its source
        run: python tools/catalogue.py
