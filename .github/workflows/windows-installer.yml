name: windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "freewill/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build as a release (tag v<version>)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[app,anthropic]" pyinstaller

      - name: Read the version
        id: version
        shell: bash
        run: echo "value=$(python -c 'import freewill; print(freewill.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Stamp the build with its exact commit (shown in the application, About this build)
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, os
          ref = os.environ.get("GITHUB_REF", "")
          stamp = {"commit": os.environ["GITHUB_SHA"], "channel": "installer",
                   "tag": ref.removeprefix("refs/tags/") if ref.startswith("refs/tags/") else None,
                   "built_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")}
          open("freewill/build.json", "w", encoding="utf-8").write(json.dumps(stamp) + "\n")
          print(stamp)
          PY

      - name: A version tag must match the version of the code
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test "${GITHUB_REF#refs/tags/}" = "v${{ steps.version.outputs.value }}" || { echo "tag ${GITHUB_REF#refs/tags/} does not match version ${{ steps.version.outputs.value }}"; exit 1; }

      - name: Fetch the embedded runtime (llama.cpp, pinned in freewill/runtime.json)
        run: python -m freewill.runtime --target runtime --platform win-x64

      - name: Build the application
        run: pyinstaller --noconfirm packaging/windows/freewill.spec

      - name: Check the packaged application
        shell: pwsh
        run: |
          $lives = Join-Path $env:RUNNER_TEMP "lives"
          $run = Start-Process -FilePath "dist\Freewill\Freewill.exe" -ArgumentList "--self-test", "--lives", "`"$lives`"" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "self-test failed with exit code $($run.ExitCode)" }
          if (-not (Test-Path (Join-Path $lives "Selftest.life"))) { throw "self-test did not bring a being into the world" }

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc "/DAppVersion=${{ steps.version.outputs.value }}" packaging\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Freewill-Setup-${{ steps.version.outputs.value }}
          path: dist/Freewill-Setup-*.exe
          if-no-files-found: error

  release:
    # On a version tag, or when someone runs the workflow by hand and ticks "publish".
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          # The notes say which commit was built and what the installer does and does not include.
          python3 tools/release_notes.py "${TAG#v}" "$GITHUB_SHA" > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.exe --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" dist/*.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Freewill $TAG (experimental)" --notes-file notes.md
          fi
