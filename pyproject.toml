[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freewill"
version = "0.1.0"
description = "An open research programme on consciousness, free will, the subconscious and dreaming in AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
freewill = "freewill.cli:main"

[tool.setuptools.packages.find]
include = ["freewill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
