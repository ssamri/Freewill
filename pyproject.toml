[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freewill"
version = "0.2.0"
description = "An open, experimental research programme on consciousness, free will, the subconscious and dreaming in AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Non-Commercial Research License (see LICENSE)" }
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
app = ["pywebview>=5", "keyring>=24", "pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
freewill = "freewill.cli:main"
freewill-app = "freewill.desktop:main"

[tool.setuptools.packages.find]
include = ["freewill*"]

[tool.setuptools.package-data]
freewill = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
